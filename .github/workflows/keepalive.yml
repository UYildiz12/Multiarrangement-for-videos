name: Keep-alive

# Queries the database through the API every six hours so the Supabase
# free-tier project is not paused for inactivity (Supabase asks for a few
# requests a day; one query every two days let it pause in October 2026).
# A failed run makes GitHub e-mail the repository owner, which doubles as a
# basic uptime alert.

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping-database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check API and database health
        run: >-
          curl -fsS --retry 3 --retry-delay 30 --retry-all-errors --max-time 30
          https://multiarrangement-api-production.up.railway.app/health/db
      - name: Read an application table
        # An unknown invite token is looked up in chain_invites and returns 404.
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-delay 30 --max-time 30 \
            https://multiarrangement-api-production.up.railway.app/api/v1/public/chain-invites/keepalive/status)
          echo "HTTP $code"
          test "$code" = 404
